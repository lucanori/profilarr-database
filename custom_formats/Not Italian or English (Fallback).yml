name: Not Italian or English (Fallback)
description: Matches releases that don't include both Italian and English language tracks, using fallback detection for dual audio.
tags:
  - Language
conditions:
  - language: italian
    negate: true
    required: true
    type: language
  - language: english
    negate: true
    required: true
    type: language
  - pattern: Dual Audio
    negate: true
    required: true
    type: release_title
