 name: Not Italian or English (Fallback)
 description: Matches releases that don't include both Italian and English language tracks, using fallback detection for dual audio.
 tags:
 - Language
 conditions:
 - language: italian
   negate: true
   required: true
   type: language
 - language: english
   negate: true
   required: true
   type: language
 - pattern: Dual Audio
   negate: true
   required: true
   type: release_title
 tests:
 - expected: false
   input: Movie.2023.ITA-ENG.1080p.BluRay
 - expected: false
   input: Movie.2023.Dual.Audio.1080p.BluRay
 - expected: true
   input: Movie.2023.ITA.1080p.BluRay
 - expected: true
   input: Movie.2023.ENG.1080p.BluRay
 - expected: true
   input: Movie.2023.FRA.1080p.BluRay
 - expected: false
   input: Movie.2023.ITA.Dual.Audio.1080p.BluRay