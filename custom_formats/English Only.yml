name: English Only
description: Matches releases that include English language track but exclude Italian.
tags:
- Language
conditions:
  - language: english
    negate: false
    required: true
    type: language
  - language: italian
    negate: true
    required: true
    type: language
tests:
  - conditionResults:
      - matches: true
        name: English Required
        negate: false
        required: true
        pattern: ENG
        type: release_title
      - matches: true
        name: Italian Excluded
        negate: true
        required: true
        pattern: ITA
        type: release_title
    expected: false
    id: 1
    input: Movie.2023.ITA-ENG.1080p.BluRay
    lastRun: '2025-11-18T10:02:00.000000'
    passes: true
  - conditionResults:
      - matches: false
        name: English Required
        negate: false
        required: true
        pattern: ENG
        type: release_title
      - matches: true
        name: Italian Excluded
        negate: true
        required: true
        pattern: ITA
        type: release_title
    expected: false
    id: 2
    input: Movie.2023.ITA.1080p.BluRay
    lastRun: '2025-11-18T10:02:01.000000'
    passes: true
  - conditionResults:
      - matches: true
        name: English Required
        negate: false
        required: true
        pattern: ENG
        type: release_title
      - matches: false
        name: Italian Excluded
        negate: true
        required: true
        pattern: ITA
        type: release_title
    expected: true
    id: 3
    input: Movie.2023.ENG.1080p.BluRay
    lastRun: '2025-11-18T10:02:02.000000'
    passes: true
  - conditionResults:
      - matches: false
        name: English Required
        negate: false
        required: true
        pattern: ENG
        type: release_title
      - matches: false
        name: Italian Excluded
        negate: true
